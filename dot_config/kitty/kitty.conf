# Импорт цветов из внешнего файла (если нужен)
# В Kitty можно использовать include, но убедитесь, что файл ~/.config/colors.conf
# существует и имеет формат Kitty (например, background #1e1e2e).
# Если хотите просто задать фон – задайте ниже.
include ~/.config/colors.conf

# Убрать всё оформление окна (рамки, кнопки)
hide_window_decorations yes

# Прозрачность фона (0.666 = ~67%)
background_opacity 0.666

# Размер окна в символах (ширина 120, высота 30)
initial_window_width  120c
initial_window_height 30c

# Цвет фона (переопределит импортированный, если он там не задан)
background #1e1e2e

# Шрифт и размер
font_family      Hack Nerd Font
font_size        14
# Regular – стиль по умолчанию, отдельно указывать не нужно

# Запускать tmux вместо шелла
shell /Users/harveyfa/bin/tmux
shell_args new-session -A -D -s main

# Количество сохраняемых строк прокрутки
scrollback_lines 1000

# Переменная окружения
env TERM xterm-256color
